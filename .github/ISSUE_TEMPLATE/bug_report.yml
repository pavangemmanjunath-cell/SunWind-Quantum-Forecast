name: Bug report
description: Report a reproducible defect in the code, API, dashboard, or documentation.
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is failing?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and runtime versions
      placeholder: "Windows 11, Python 3.12, Node.js 20"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove secrets and private data before posting.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
