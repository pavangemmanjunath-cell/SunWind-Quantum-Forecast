[project]
name = "qvk-forecast"
version = "0.1.0"
description = "Quantum-inspired variational kernel framework for cross-region solar and wind forecasting (CPU-only)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741", "E501", "E702"]
[tool.pytest.ini_options]
testpaths = ["tests"]
